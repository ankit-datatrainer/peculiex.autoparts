# MotoMart — nginx reverse proxy in front of the Next.js server.
# Replace motomart.example.com with your domain before going live.

upstream motomart_web {
    server web:3000;          # use 127.0.0.1:3000 when running nginx outside Docker
    keepalive 32;
}

# --- HTTP: ACME challenge + redirect to HTTPS --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name motomart.example.com www.motomart.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name motomart.example.com www.motomart.example.com;

    ssl_certificate     /etc/letsencrypt/live/motomart.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motomart.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # product image uploads from the admin panel
    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Immutable build output
    location /_next/static/ {
        proxy_pass http://motomart_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Self-hosted images and icons
    location /assets/ {
        proxy_pass http://motomart_web;
        add_header Cache-Control "public, max-age=2592000";
    }

    # The admin panel and account pages must never be cached by a proxy
    location ~ ^/(admin|account|checkout|api)/ {
        proxy_pass http://motomart_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://motomart_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
