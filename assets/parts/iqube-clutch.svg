<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B0BEC5" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#78909C" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Technical Grid Overlay -->
  <g stroke="#94A3B8" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
  </g>

  <!-- Top Brand Watermark Banner -->
  <rect x="20" y="16" width="160" height="30" rx="6" fill="#0052CC" filter="url(#cardShadow)"/>
  <text x="100" y="36" fill="#FFFFFF" font-size="12" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="1" text-anchor="middle">IQUBE (TVS)</text>

  <!-- Genuine OEM Guarantee Holographic Stamp -->
  <g transform="translate(330, 32)">
    <circle r="20" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
    <circle r="16" fill="none" stroke="#EAB308" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="0" y="-3" fill="#854D0E" font-size="6" font-family="'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">100%</text>
    <text x="0" y="6" fill="#854D0E" font-size="6" font-family="'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">GENUINE</text>
    <text x="0" y="13" fill="#854D0E" font-size="5" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">OEM</text>
  </g>

  <!-- Technical Part Drawing -->
  
    <g transform="translate(200, 200)">
      <!-- Outer Clutch Basket Rim -->
      <circle r="130" fill="#2B2D42" stroke="#0052CC" stroke-width="6"/>
      <!-- Inner Friction Teeth -->
      <g fill="#E2E8F0">
        <rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(0)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(22.5)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(45)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(67.5)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(90)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(112.5)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(135)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(157.5)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(180)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(202.5)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(225)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(247.5)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(270)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(292.5)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(315)" fill="#0052CC"/><rect x="-10" y="-136" width="20" height="18" rx="3" transform="rotate(337.5)" fill="#0052CC"/>
      </g>
      <!-- Friction Material Ring -->
      <circle r="115" fill="#C5A059" stroke="#8D6E63" stroke-width="16" stroke-dasharray="14 8"/>
      <!-- Center Steel Plate -->
      <circle r="85" fill="#4A4E69" stroke="#9E9E9E" stroke-width="4"/>
      <!-- Clutch Springs (6 heavy duty) -->
      
          <g transform="rotate(0) translate(0, -50)">
            <rect x="-12" y="-16" width="24" height="32" rx="6" fill="#FFC107" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="0" x2="12" y2="0" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="8" x2="12" y2="8" stroke="#333" stroke-width="2"/>
          </g>
        
          <g transform="rotate(60) translate(0, -50)">
            <rect x="-12" y="-16" width="24" height="32" rx="6" fill="#FFC107" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="0" x2="12" y2="0" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="8" x2="12" y2="8" stroke="#333" stroke-width="2"/>
          </g>
        
          <g transform="rotate(120) translate(0, -50)">
            <rect x="-12" y="-16" width="24" height="32" rx="6" fill="#FFC107" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="0" x2="12" y2="0" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="8" x2="12" y2="8" stroke="#333" stroke-width="2"/>
          </g>
        
          <g transform="rotate(180) translate(0, -50)">
            <rect x="-12" y="-16" width="24" height="32" rx="6" fill="#FFC107" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="0" x2="12" y2="0" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="8" x2="12" y2="8" stroke="#333" stroke-width="2"/>
          </g>
        
          <g transform="rotate(240) translate(0, -50)">
            <rect x="-12" y="-16" width="24" height="32" rx="6" fill="#FFC107" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="0" x2="12" y2="0" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="8" x2="12" y2="8" stroke="#333" stroke-width="2"/>
          </g>
        
          <g transform="rotate(300) translate(0, -50)">
            <rect x="-12" y="-16" width="24" height="32" rx="6" fill="#FFC107" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="-8" x2="12" y2="-8" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="0" x2="12" y2="0" stroke="#333" stroke-width="2"/>
            <line x1="-12" y1="8" x2="12" y2="8" stroke="#333" stroke-width="2"/>
          </g>
        
      <!-- Splined Center Hub -->
      <circle r="25" fill="#1E293B" stroke="#FFF" stroke-width="3"/>
      <circle r="12" fill="#000"/>
    </g>
  

  <!-- Bottom Part Type & Tag Badge -->
  <rect x="24" y="348" width="352" height="36" rx="8" fill="#0F172A" opacity="0.92"/>
  <text x="40" y="371" fill="#38BDF8" font-size="11" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" letter-spacing="0.5">TVS iQUBE EV SPARES</text>
  <text x="360" y="371" fill="#F8FAFC" font-size="12" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" text-anchor="end">CLUTCH</text>
</svg>
